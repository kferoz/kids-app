<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✏️ Sentence Studio</title>
  <meta name="description" content="A 3rd-grade writing course with Penny the Pencil: build sentences, stretch them with details, fix mistakes, then write paragraphs and stories in your own words." />
  <link href="../fonts/fonts.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/writepad.css" />
</head>
<body data-screen="home">
  <div id="confetti" class="confetti-box" aria-hidden="true"></div>

  <header class="topbar">
    <a class="home-link" href="../index.html" title="Back to the Learning Hub">🏠</a>
    <button class="icon-btn" id="backBtn" title="Back" hidden>⬅</button>
    <h1 id="topTitle">Sentence Studio</h1>
    <div class="pills">
      <span class="pill" id="ptsPill" title="Your points">⭐ 0</span>
      <button class="pill" id="stkPill" title="Sticker book">🎟️ 0</button>
      <button class="pill" id="trophyBtn" title="Trophies">🏆</button>
      <button class="pill" id="muteBtn" title="Sound on/off">🔊</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../js/profile-store.js"></script>
  <script src="../js/voice.js"></script>
  <script src="../js/activitydb.js"></script>
  <script src="../js/tracker.js" data-app="writestudio"></script>
  <script src="../js/settings.js"></script>
  <script src="../js/rewardkit.js"></script>
  <script src="../js/dollars.js"></script>
  <script src="../js/kidbar.js"></script>
  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/listener.js"></script>
  <script src="js/writecheck.js"></script>
  <script src="js/writepad.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
