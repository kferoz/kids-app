<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Print worksheet · Ad-hoc Tests</title>
  <style>
    /* Clean worksheet: black on white, no animations, answer key on its own page. */
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f2f2f2; color: #111; font: 16px/1.5 "Segoe UI", system-ui, sans-serif; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; position: sticky; top: 0; }
    .bar button, .bar a { font: 600 15px inherit; font-family: inherit; min-height: 44px; padding: 8px 16px; border: 1px solid #999; border-radius: 10px; background: #fff; color: #111; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; }
    .bar button.primary { background: #4b3bb3; color: #fff; border-color: #4b3bb3; }
    .bar label { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
    .sheet { background: #fff; max-width: 820px; margin: 16px auto; padding: 36px 44px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
    h1 { font-size: 24px; margin: 0 0 4px; }
    .meta { color: #444; margin: 0 0 14px; }
    .name { display: flex; gap: 24px; margin: 8px 0 18px; font-size: 17px; }
    .name span { flex: 1; border-bottom: 1px solid #111; padding-bottom: 2px; }
    ol.qs { padding-left: 26px; margin: 0; }
    ol.qs > li { margin: 0 0 22px; break-inside: avoid; page-break-inside: avoid; }
    .p { font-weight: 600; margin: 0 0 6px; }
    .tpl { font-size: 19px; line-height: 2.2; }
    .blank { display: inline-block; min-width: 70px; border-bottom: 2px solid #111; margin: 0 4px; }
    .opts { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 6px; }
    .opts li::before { content: "○"; display: inline-block; width: 1.6em; font-size: 18px; }
    .word { font-size: 34px; font-weight: 700; margin: 4px 0; }
    .pic { max-width: 380px; }
    .groups { font-size: 15px; color: #333; }
    .note { color: #555; font-size: 14px; }
    .key { break-before: page; page-break-before: always; }
    .key ol { padding-left: 26px; }
    .key li { margin-bottom: 4px; }
    .err { text-align: center; padding: 40px; }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .sheet { box-shadow: none; margin: 0; max-width: none; padding: 0; }
      .no-key .key { display: none; }
    }
    @media (max-width: 600px) { .sheet { padding: 20px 16px; margin: 0; } }
  </style>
</head>
<body>
  <div class="bar" id="bar" hidden>
    <a href="tests.html">← Back to tests</a>
    <label><input type="checkbox" id="withKey" checked> Include answer key</label>
    <button class="primary" id="printBtn">🖨 Print</button>
  </div>
  <main id="out"></main>

  <script src="../js/adminpin.js"></script>
  <script src="../adventurepack/stickerquest/src/engine/mathQuestions.js"></script>
  <script src="../adventurepack/stickerquest/src/data/adhocTests.js"></script>
  <script src="../js/adhocstore.js"></script>
  <script src="js/print.js"></script>
</body>
</html>
