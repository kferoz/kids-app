<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🥁 Bongo's Syllable Beats</title>
  <meta name="description" content="Learn syllables with Bongo the drumming monkey: clap the beats, jumble cards, chop words, fun memory notes and jokes, then read to Bongo. Kindergarten (#kg) and Grade 3 (#g3) tracks, easy to grade level." />
  <link href="../fonts/fonts.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="confetti" class="confetti-box" aria-hidden="true"></div>

  <header class="topbar">
    <a class="home-link" href="../index.html" title="Back to the Learning Hub">🏠</a>
    <button class="icon-btn" id="backBtn" title="All lessons" hidden>⬅</button>
    <h1 id="topTitle">Bongo's Syllable Beats</h1>
    <div class="pills">
      <span class="pill" id="ptsPill" title="Your stars">⭐ 0</span>
      <button class="pill" id="stkPill" title="Stickers">🎟️ 0</button>
      <button class="pill" id="trophyBtn" title="Trophies">🏆</button>
      <button class="pill" id="muteBtn" title="Sound on/off">🔊</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../js/profile-store.js"></script>
  <script src="../js/voice.js"></script>
  <script src="../js/activitydb.js"></script>
  <script src="../js/tracker.js" data-app="syllables"></script>
  <script src="../js/settings.js"></script>
  <script src="../js/rewardkit.js"></script>
  <script src="../js/dollars.js"></script>
  <script src="../js/kidbar.js"></script>
  <script src="../js/readlevel.js"></script>
  <script src="js/listener.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
