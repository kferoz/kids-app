<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐝 Buzzy's Spelling Bee</title>
  <meta name="description" content="Spelling bee practice for 3rd grade with Buzzy the bee: the 2026–27 school study words, honeycombs to fill, Learn, Missing Letters, Unscramble, Hear & Spell, an on-stage Bee Contest, a Daily Buzz, a Tricky Jar and grown-up practice tests." />
  <link href="../fonts/fonts.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-screen="home">
  <div id="confetti" class="confetti-box" aria-hidden="true"></div>

  <header class="topbar">
    <a class="home-link" href="../index.html" title="Back to the Learning Hub">🏠</a>
    <button class="icon-btn" id="backBtn" title="Back" hidden>⬅</button>
    <h1 id="topTitle">Buzzy's Spelling Bee</h1>
    <div class="pills">
      <span class="pill" id="ptsPill" title="Your honey points">🍯 0</span>
      <button class="pill" id="stkPill" title="Sticker book">🎟️ 0</button>
      <button class="pill" id="trophyBtn" title="Trophies">🏆</button>
      <button class="pill" id="muteBtn" title="Sound on/off">🔊</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../js/profile-store.js"></script>
  <script src="../js/voice.js"></script>
  <script src="../js/activitydb.js"></script>
  <script src="../js/tracker.js" data-app="spellingbee"></script>
  <script src="../js/settings.js"></script>
  <script src="../js/rewardkit.js"></script>
  <script src="../js/dollars.js"></script>
  <script src="../js/kidbar.js"></script>

  <script src="js/app.js"></script>
