<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐨 Koa's Reading Gym</title>
  <meta name="description" content="Reading comprehension training with Coach Koa: a Kindergarten listen-and-think track (13 lessons, everything read aloud) and a Grade 3 track (15 lessons). Learn a strategy, watch Koa think aloud, try it together, then read and prove answers on your own." />
  <link href="../fonts/fonts.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="confetti" class="confetti-box" aria-hidden="true"></div>

  <header class="topbar">
    <a class="home-link" href="../index.html" title="Back to the Learning Hub">🏠</a>
    <button class="icon-btn" id="backBtn" title="Back to the gym" hidden>⬅</button>
    <h1 id="topTitle">Koa's Reading Gym</h1>
    <div class="pills">
      <span class="pill" id="ptsPill" title="Your stars">⭐ 0</span>
      <button class="pill" id="stkPill" title="Stickers">🎟️ 0</button>
      <button class="pill" id="trophyBtn" title="Trophies">🏆</button>
      <button class="pill" id="muteBtn" title="Sound on/off">🔊</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../js/profile-store.js"></script>
  <script src="../js/voice.js"></script>
  <script src="../js/activitydb.js"></script>
  <script src="../js/tracker.js" data-app="readgym"></script>
  <script src="../js/settings.js"></script>
  <script src="../js/rewardkit.js"></script>
  <script src="../js/dollars.js"></script>
  <script src="../js/kidbar.js"></script>
  <script src="js/data.js"></script>
  <script src="js/data-kg.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
