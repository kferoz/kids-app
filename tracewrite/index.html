<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>🖍️ Write &amp; Trace</title>
  <meta name="description" content="Kindergarten handwriting with Scribbles the Crayon: warm-up lines, then trace and write letters and first words with your finger." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/tracepad.css" />
</head>
<body data-screen="home">
  <div id="confetti" class="confetti-box" aria-hidden="true"></div>

  <header class="topbar">
    <a class="home-link" href="../index.html" title="Back to the Learning Hub">🏠</a>
    <button class="icon-btn" id="backBtn" title="Back" hidden>⬅</button>
    <h1 id="topTitle">Write &amp; Trace</h1>
    <div class="pills">
      <span class="pill" id="ptsPill" title="Your points">⭐ 0</span>
      <button class="pill" id="stkPill" title="Sticker book">🎟️ 0</button>
      <button class="pill" id="trophyBtn" title="Trophies">🏆</button>
      <button class="pill" id="muteBtn" title="Sound on/off">🔊</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../js/profile-store.js"></script>
  <script src="../js/voice.js"></script>
  <script src="../js/activitydb.js"></script>
  <script src="../js/tracker.js" data-app="tracewrite"></script>
  <script src="../js/dollars.js"></script>
  <script src="../js/kidbar.js"></script>
  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/tracepad.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
